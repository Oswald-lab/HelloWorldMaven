<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My tasks</title>
    <style>
        .task-list {
            max-height: 70vh;
            overflow-y: auto;
            padding-left: 1.25rem;
        }
        .task-list li.completed .task-title {
            text-decoration: line-through;
            color: #6b7280;
        }
        .status-badge {
            display: inline-block;
            padding: 0.05rem 0.45rem;
            border-radius: 0.75rem;
            background: #e5e7eb;
            font-size: 0.85em;
        }
        .task-list li.completed .status-badge {
            background: #bbf7d0;
            color: #166534;
        }
        .done-indicator {
            color: #166534;
            font-weight: bold;
        }
    </style>
</head>
<body>
<h1>My tasks</h1>
<p>
    Signed in as <strong th:text="${email}"></strong>
    <form method="post" action="/logout" style="display: inline;">
        <button type="submit">Sign out</button>
    </form>
</p>

<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<form method="post" action="/tasks">
    <p>
        <label for="title">Title</label>
        <input id="title" type="text" name="title" required maxlength="200" th:value="${title}">
    </p>
    <p>
        <label for="description">Description (optional)</label>
        <textarea id="description" name="description" rows="2" th:text="${description}"></textarea>
    </p>
    <p>
        <label for="dueDate">Due date</label>
        <input id="dueDate" type="date" name="dueDate" required th:value="${dueDate}">
    </p>
    <p>
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
            <option value="High" th:selected="${priority == 'High'}">High</option>
            <option value="Medium" th:selected="${priority == null or priority == '' or priority == 'Medium'}">Medium</option>
            <option value="Low" th:selected="${priority == 'Low'}">Low</option>
        </select>
    </p>
    <fieldset>
        <legend>Subtasks (optional)</legend>
        <div id="subtasks">
            <p><input type="text" name="subtasks" maxlength="200" placeholder="Subtask title"></p>
        </div>
        <button type="button" onclick="addSubtask()">Add another subtask</button>
    </fieldset>
    <p>
        <button type="submit">Add task</button>
    </p>
</form>

<ul class="task-list">
    <li th:each="task : ${tasks}" th:classappend="${task.completed} ? 'completed' : ''">
        <form method="post" th:action="@{/tasks/{id}/status(id=${task.id})}" style="display: inline;">
            <select name="status" onchange="this.form.submit()">
                <option th:each="status : ${statuses}"
                        th:value="${status}"
                        th:text="${status}"
                        th:selected="${status == task.status}"
                        th:disabled="${status != task.status and !task.canTransitionTo(status)}"></option>
            </select>
        </form>
        <span class="task-title" th:text="${task.title}"></span>
        <span class="status-badge" th:text="${task.status}"></span>
        <span th:if="${task.completed}" class="done-indicator">&#10003; Done</span>
        <span th:text="'Priority: ' + ${task.priority}"></span>
        <span th:text="'Due: ' + ${task.dueDate}"></span>
        <span th:if="${task.description != null}" th:text="'— ' + ${task.description}"></span>
        <form method="post" th:action="@{/tasks/{id}/delete(id=${task.id})}" style="display: inline;">
            <button type="submit">Delete</button>
        </form>
        <ul th:if="${!#lists.isEmpty(task.subtasks)}">
            <li th:each="subtask : ${task.subtasks}" th:classappend="${subtask.completed} ? 'completed' : ''">
                <form method="post" th:action="@{/tasks/{id}/status(id=${subtask.id})}" style="display: inline;">
                    <select name="status" onchange="this.form.submit()">
                        <option th:each="status : ${statuses}"
                                th:value="${status}"
                                th:text="${status}"
                                th:selected="${status == subtask.status}"
                                th:disabled="${status != subtask.status and !subtask.canTransitionTo(status)}"></option>
                    </select>
                </form>
                <span class="task-title" th:text="${subtask.title}"></span>
                <span class="status-badge" th:text="${subtask.status}"></span>
                <span th:if="${subtask.completed}" class="done-indicator">&#10003; Done</span>
                <form method="post" th:action="@{/tasks/{id}/delete(id=${subtask.id})}" style="display: inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        </ul>
    </li>
</ul>
<p th:if="${#lists.isEmpty(tasks)}">You have no tasks yet.</p>

<script>
    function addSubtask() {
        var container = document.getElementById('subtasks');
        var row = document.createElement('p');
        var input = document.createElement('input');
        input.type = 'text';
        input.name = 'subtasks';
        input.maxLength = 200;
        input.placeholder = 'Subtask title';
        row.appendChild(input);
        container.appendChild(row);
    }
</script>
</body>
</html>
